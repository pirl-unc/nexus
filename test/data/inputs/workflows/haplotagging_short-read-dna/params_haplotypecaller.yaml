# Test fixture: short-read DNA haplotagging using GATK4 HaplotypeCaller
# (single-chromosome, chr17) with both phasers. HC produces strict-diploid GTs,
# so HapCUT2 is wired here.
# Sample-specific paths (samples_tsv_file, output_dir, reference_genome_fasta_file)
# are filled in by the test.
samples_tsv_file: ""
output_dir: ""
reference_genome_fasta_file: ""

small_variant_callers: "haplotypecaller"
phasing_methods: "all"
haplotag_output: "bam"

haplotypecaller:
  extra_args: ""
  chromosomes: "chr17"

whatshap:
  phase_extra_args: "--mapq 20"
  haplotag_extra_args: "--ignore-read-groups --skip-missing-contigs --output-threads 4"

hapcut2_whatshap:
  read_technology: "illumina"
  extracthairs_extra_args: ""
  hapcut2_extra_args: ""
  whatshap_haplotag_extra_args: "--ignore-read-groups --skip-missing-contigs --output-threads 4"
