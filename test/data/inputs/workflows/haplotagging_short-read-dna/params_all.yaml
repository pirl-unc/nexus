# Test fixture: short-read DNA haplotagging exercising every (caller × phaser)
# combination — DeepVariant + HaplotypeCaller + Clair3 + Strelka2-germline ×
# WhatsHap + HapCUT2-WhatsHap.
#
# NOTE: HapCUT2 from DeepVariant may fail on non-diploid GTs in some WGS
# DV outputs. If that happens for this fixture, drop "hapcut2-whatshap" or
# switch small_variant_callers to a more HapCUT2-friendly subset.
#
# Sample-specific paths (samples_tsv_file, output_dir, reference_genome_fasta_file,
# deepvariant.input_path, deepvariant.output_path) are filled in by the test.
samples_tsv_file: ""
output_dir: ""
reference_genome_fasta_file: ""

small_variant_callers: "all"
phasing_methods: "all"
haplotag_output: "bam"

deepvariant:
  input_path: ""
  output_path: ""
  containerization: "docker"
  model_type: "WGS"
  bin_path: "/opt/deepvariant/bin/run_deepvariant"
  bin_version: "1.9.0"

haplotypecaller:
  extra_args: ""
  chromosomes: "chr17"

clair3:
  extra_args: "--model_path=/opt/models/ilmn/ --platform=ilmn --include_all_ctgs --min_coverage=3"

strelka2_germline:
  extra_args: ""

whatshap:
  phase_extra_args: "--mapq 20"
  haplotag_extra_args: "--ignore-read-groups --skip-missing-contigs --output-threads 4"

hapcut2_whatshap:
  read_technology: "illumina"
  extracthairs_extra_args: ""
  hapcut2_extra_args: ""
  whatshap_haplotag_extra_args: "--ignore-read-groups --skip-missing-contigs --output-threads 4"
