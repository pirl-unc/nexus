# Test fixture: short-read DNA haplotagging using Clair3 (Illumina model)
# with WhatsHap as the phaser. HapCUT2 is intentionally skipped here because
# Clair3 on the test BAM (chr17-only, sparse coverage) produces a near-empty
# VCF and HapCUT2's strict diploid-GT check fails on sparse VCFs in CI.
# Clair3 args match the known-passing test_variant_calling_clair3_2 fixture.
# Sample-specific paths (samples_tsv_file, output_dir, reference_genome_fasta_file)
# are filled in by the test.
samples_tsv_file: ""
output_dir: ""
reference_genome_fasta_file: ""

small_variant_callers: "clair3"
phasing_methods: "whatshap"
haplotag_output: "bam"

clair3:
  extra_args: "--model_path=/opt/models/ilmn/ --platform=ilmn --min_coverage=3"

whatshap:
  phase_extra_args: "--mapq 20"
  haplotag_extra_args: "--ignore-read-groups --skip-missing-contigs --output-threads 4"
