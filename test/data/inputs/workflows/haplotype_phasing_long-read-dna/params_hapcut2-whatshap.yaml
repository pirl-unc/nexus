# Test fixture: focused on the HapCUT2 + WhatsHap-haplotag phaser path.
# Uses Longshot as the small-variants caller; runs ONLY the hapcut2-whatshap
# method (no hiphase / whatshap / pbsv).
#
# Note: The DeepVariant→HapCUT2 path is intentionally not wired in
# haplotype_phasing_long-read-dna.nf (HapCUT2 requires strict diploid GTs and
# DV's WGS VCFs are awkward to filter), so HapCUT2 only runs from Longshot's VCF.
samples_tsv_file: ""
output_dir: ""
reference_genome_fasta_file: ""

small_variants_caller: "longshot"
methods: "hapcut2-whatshap"

deepvariant:
  input_path: ""
  output_path: ""
  containerization: "docker"
  model_type: "PACBIO"
  bin_path: "/opt/deepvariant/bin/run_deepvariant"
  bin_version: "1.9.0"

longshot:
  extra_args: ""

pbsv:
  discover_extra_args: "--ccs --min-gap-comp-id-perc 97 --min-mapq 20"
  call_extra_args: "--ccs --call-min-reads-per-strand-all-samples 0 --call-min-read-perc-one-sample 10 --call-min-reads-all-samples 3 --call-min-reads-one-sample 3"

whatshap:
  phase_extra_args: "--mapq 20"
  haplotag_extra_args: "--ignore-read-groups --tag-supplementary --skip-missing-contigs --output-threads 4"

hapcut2_whatshap:
  read_technology: "pacbio"
  extracthairs_extra_args: ""
  hapcut2_extra_args: ""
  whatshap_haplotag_extra_args: "--ignore-read-groups --tag-supplementary --skip-missing-contigs --output-threads 4"
